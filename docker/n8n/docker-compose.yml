version: "3.6"
services:
  n8n:
    container_name: "n8n"
    environment:
      - "N8N_HOST=${HOSTNAME}"
      - "N8N_PROTOCOL=https"
      - "N8N_PORT=443"
      - "WEBHOOK_URL=https://${HOSTNAME}/"
      - "N8N_EDITOR_BASE_URL=https://${HOSTNAME}/"
    image: "docker.n8n.io/n8nio/n8n"
    ports:
      - "5678:5678/tcp"
    volumes:
      - "/home/ran-markovich/n8n_data:/home/node/.n8n"
    restart: "unless-stopped"
